id: net-sigma-001
title: Known Malicious Command & Control Beaconing
status: stable
description: Detects network egress connections matching known Cobalt Strike, Empire,
  or Metasploit C2 IP addresses.
author: ETHIO-CYBERGUARD Detection Team
version: 1.1.0
date: '2026-09-30'
references:
- https://attack.mitre.org/techniques/T1071/001/
tags:
- attack.command_and_control
- attack.t1071.001
logsource:
  category: network_connection
  product: firewall
detection:
  selection:
    destination.ip:
    - 185.220.101.5
    - 196.188.99.12
  condition: selection
falsepositives:
- Threat research sandboxes
severity: critical
