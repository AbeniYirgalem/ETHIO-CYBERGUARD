id: win-sigma-001
title: Suspicious Obfuscated PowerShell Execution
status: stable
description: Detects encoded or obfuscated PowerShell commands often used in initial
  stagers or fileless execution.
author: ETHIO-CYBERGUARD Detection Team
version: 1.2.0
date: '2026-09-30'
references:
- https://attack.mitre.org/techniques/T1059/001/
tags:
- attack.execution
- attack.t1059.001
- car.2013-05-009
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process.name: powershell.exe
    process.command_line:
    - '*-enc*'
    - '*-encodedcommand*'
    - '*downloadstring*'
    - '*invoke-expression*'
    - '*iex*'
  condition: selection
falsepositives:
- Legitimate enterprise deployment scripts utilizing base64 encoding (e.g., SCCM,
  Ansible)
severity: critical
