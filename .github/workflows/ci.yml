name: ETHIO-CYBERGUARD CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax Compile Check
        run: |
          python -m compileall -q apps/ services/ collectors/ detection/ tests/

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build Web Application
        working-directory: apps/web
        run: npm run build

  docker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate production compose file
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123
          INGEST_API_KEY: ci-only-ingest-key-0123456789
          BOOTSTRAP_ADMIN_EMAIL: admin@example.org
          BOOTSTRAP_ADMIN_PASSWORD: Ci-Only-Passw0rd!
          ALLOWED_ORIGINS: https://soc.example.org
          PUBLIC_API_URL: https://api.example.org
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q

      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t ecg-api:ci .

      - name: Build web image
        run: docker build -f infrastructure/docker/Dockerfile.web --build-arg VITE_API_URL=https://api.example.org -t ecg-web:ci apps/web

      - name: API image starts and passes its health check
        run: |
          docker run -d --name ecg-api-ci -p 8000:8000 ecg-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live; then exit 0; fi
            sleep 2
          done
          docker logs ecg-api-ci
          exit 1
