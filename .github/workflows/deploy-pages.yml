name: Deploy ETHIO-CYBERGUARD to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Web Application
        working-directory: apps/web
        run: npm run build

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          publish_branch: gh-pages

      - name: Update GitHub Deployment Status
        if: success()
        run: |
          DEPLOY_ID=$(gh api -X POST repos/${{ github.repository }}/deployments \
            -f ref="${{ github.sha }}" \
            -f environment="github-pages" \
            -f description="Automated GitHub Pages production deployment" \
            -F auto_merge=false \
            -F "required_contexts[]" \
            --jq .id)
          if [ -n "$DEPLOY_ID" ]; then
            gh api -X POST repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses \
              -f state="success" \
              -f environment_url="https://abeniyirgalem.github.io/ETHIO-CYBERGUARD/" \
              -f description="ETHIO-CYBERGUARD live and verified on GitHub Pages"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
