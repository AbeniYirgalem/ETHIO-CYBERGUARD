version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecg_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecg_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecg_dev_insecure_password_do_not_use_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-ethio_cyberguard_dev}
    # Bound to local loopback interface only for development security
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecg_dev_user} -d ${POSTGRES_DB:-ethio_cyberguard_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql
    networks:
      - ecg_dev_network

  redis:
    image: redis:7-alpine
    container_name: ecg_redis_dev
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-ecg_dev_redis_secret_local}"
    # Bound to local loopback interface only for development security
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ecg_dev_redis_secret_local}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecg_dev_network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ecg_api_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecg_dev_user}:${POSTGRES_PASSWORD:-ecg_dev_insecure_password_do_not_use_in_prod}@postgres:5432/${POSTGRES_DB:-ethio_cyberguard_dev}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ecg_dev_redis_secret_local}@redis:6379/0
      API_SECRET_KEY: ${API_SECRET_KEY:-ecg_dev_jwt_secret_key_change_in_prod_strictly}
      JWT_SECRET: ${JWT_SECRET:-ecg_dev_jwt_secret_key_change_in_prod_strictly}
      INGEST_API_KEY: ${INGEST_API_KEY:-ecg-dev-collector-key-2026}
      DEMO_MODE: ${DEMO_MODE:-true}
      ENVIRONMENT: "development"
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./apps/api:/app/apps/api
      - ./services:/app/services
      - ./database:/app/database
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecg_dev_network

  web:
    image: node:20-alpine
    container_name: ecg_web_dev
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    networks:
      - ecg_dev_network

networks:
  ecg_dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
