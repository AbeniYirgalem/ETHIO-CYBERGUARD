services:
  postgres:
    image: postgres:16-alpine
    container_name: ecg_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecg_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecOpsPassw0rd_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-ethio_cyberguard}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ecg_admin} -d $${POSTGRES_DB:-ethio_cyberguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql
    networks:
      - ecg_network

  redis:
    image: redis:7-alpine
    container_name: ecg_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecg_network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ecg_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecg_admin}:${POSTGRES_PASSWORD:-SecOpsPassw0rd_2026!}@postgres:5432/${POSTGRES_DB:-ethio_cyberguard}
      REDIS_URL: redis://redis:6379/0
      API_SECRET_KEY: ${API_SECRET_KEY:-ecg_development_jwt_secret_key_change_in_prod}
      JWT_SECRET: ${JWT_SECRET:-}
      INGEST_API_KEY: ${INGEST_API_KEY:-ecg-collector-secure-api-key-2026}
      DEMO_MODE: ${DEMO_MODE:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecg_network

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: ecg_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ecg_network

networks:
  ecg_network:
    driver: bridge

volumes:
  postgres_data:
