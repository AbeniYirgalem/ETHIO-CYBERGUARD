version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecg_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecg_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided via environment in production}
      POSTGRES_DB: ${POSTGRES_DB:-ethio_cyberguard}
    # Database is strictly private to container network in production (no host port publishing)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecg_admin} -d ${POSTGRES_DB:-ethio_cyberguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql
    networks:
      - ecg_network

  redis:
    image: redis:7-alpine
    container_name: ecg_redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be provided via environment in production}"
    # Redis cache is strictly private to container network in production
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ecg_network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ecg_api
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecg_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ethio_cyberguard}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_SECRET_KEY: ${API_SECRET_KEY:?API_SECRET_KEY must be provided via environment in production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided via environment in production}
      INGEST_API_KEY: ${INGEST_API_KEY:?INGEST_API_KEY must be provided via environment in production}
      ENVIRONMENT: "production"
      DEMO_MODE: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://abeniyirgalem.github.io}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecg_network

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: ecg_web
    restart: always
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - ecg_network

networks:
  ecg_network:
    driver: bridge

volumes:
  postgres_data:
