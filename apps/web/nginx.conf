server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (add_header lives only at server level on purpose:
    # a add_header inside a location would replace these).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://localhost:8000 http://127.0.0.1:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hashed build assets can be cached for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated
    location = /index.html {
        expires -1;
    }

    # Single-page app fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
