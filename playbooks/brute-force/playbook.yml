name: Distributed Brute Force Response Playbook
id: PB-BRUTE-03
description: Automated boundary rate limiting and IP blocking for authentication floods.
trigger:
  incident_type: brute_force_attack
  minimum_severity: HIGH

steps:
  - id: step_1
    name: Apply Dynamic Edge Firewall Drop Rule
    action: BLOCK_IP
    requires_approval: false
    duration_hours: 24

  - id: step_2
    name: Lock Targeted Account If Threshold Exceeded
    action: LOCK_TARGET_ACCOUNT
    requires_approval: false

  - id: step_3
    name: Check Indicator Against National Blacklists
    action: ENRICH_THREAT_INTEL
    requires_approval: false
