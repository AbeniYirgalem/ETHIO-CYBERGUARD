apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecg-ingress
  namespace: ecg-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/websocket-services: "ecg-api-service"
spec:
  tls:
    - hosts:
        - cyberguard.et
        - api.cyberguard.et
      secretName: ecg-tls-secret
  rules:
    - host: api.cyberguard.et
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecg-api-service
                port:
                  number: 8000
    - host: cyberguard.et
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecg-web-service
                port:
                  number: 80
